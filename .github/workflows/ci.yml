name: CI

on:
  push:
    branches: [ main, develop, work ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type definitions smoke test
        run: pnpm exec tsc --project tsconfig.types.json --noEmit

      - name: Run tests
        run: pnpm exec vitest run --run

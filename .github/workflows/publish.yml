name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (latest or beta)'
        required: true
        default: 'beta'
        type: choice
        options:
          - latest
          - beta

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build SDK
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/adaptive-sdk.esm.js || exit 1
          test -f dist/adaptive-sdk.cjs || exit 1
          test -f dist/adaptive-sdk.umd.js || exit 1
          echo "✓ Build verified"

      - name: Publish to NPM (latest)
        if: github.event_name == 'release' || github.event.inputs.tag == 'latest'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to NPM (beta)
        if: github.event.inputs.tag == 'beta'
        run: npm publish --tag beta --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub deployment
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'npm',
              description: 'Published to NPM'
            })

      - name: Notify on success
        if: success()
        run: |
          echo "🎉 Package published successfully!"
          echo "View on NPM: https://www.npmjs.com/package/vib34d-xr-quaternion-sdk"
